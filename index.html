<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Jogo Clicker</title>
        <style>
            body{
                background-color: #000000;
                color: #ffffff;
                text-align: center;
                
            }
            .titulo{
                font-size: 50px;
                margin-top: 60px;
            }
            .subtitulo{
                font-size: 30px;
                margin-top: 5px;
                color:#333333;
            }
            #contador{
                font-size: 120px;
                margin-top: 20px;
                color:rgb(143, 0, 0);
            }
            button{
                font-size: 30px;
                padding: 10px 20px;
                margin-top: 20px;
                cursor: pointer;
            }
            h2, h3{
                margin-top: 20px;
            }
            #botao{
                background-color: transparent;
                border: none;
            }
            .upgrade{
            
                gap: 50px;
            }
            #Upgrd1, #Upgrd2{
                background-color: #333333;
                color: #ffffff;
                border: none;
                padding: 10px 20px;
                cursor: pointer;
                border-radius: 5px;
              }
            img{
                border-radius: 5%;
                transition: transform 0.2s;
            }
        </style>
  </head> 
    <body>
  <h1 class="titulo">RAGEBAIT NO FELIPE!!!</h1><br>
  <h3 class="subtitulo">clique no Felipe para ganhar RAGEBAIT!</h3>
    
    <button id="botao"><img src="felipe.jpg" alt="Felipe" width="200" height="200"></button>
    <h1 id="contador">0</h1></body>
  
   <div class="upgrade">
    <h2>Upgrade + 2 RAGEBAIT: Custa 25 clicks</h2>
     <button id="Upgrd1">Comprar upgrade</button>
    <h2>Upgrade + 5 RAGEBAIT: Custa 200 clicks</h2>
      <button id="Upgrd2">Comprar upgrade</button>
      <h3>Quantidade de upgrade: <span id="quantUpgrade">0</span></h3>
  </div>

        <script>
          let contador = 0;
          let quantUpgrade = 0;
          const Upgrd1 = document.getElementById('Upgrd1');
          const Upgrd2 = document.getElementById('Upgrd2');
          const botao = document.getElementById('botao');

            botao.addEventListener('click', () => {if(quantUpgrade == 0){
                contador++;}else{
                contador += quantUpgrade * 2;}
                document.getElementById('contador').textContent = contador;
            });
            Upgrd1.addEventListener('click', () => {
             if(contador >= 25){
                contador-=25;
                quantUpgrade += 2;
                document.getElementById('contador').textContent = contador;
                document.getElementById('quantUpgrade').textContent = quantUpgrade;
            }});
            Upgrd2.addEventListener('click', () => {
             if(contador >= 200){
                contador-=200;
                quantUpgrade += 5;
                document.getElementById('contador').textContent = contador;
                document.getElementById('quantUpgrade').textContent = quantUpgrade;}   
            });
</script>
  </body>
</html>
